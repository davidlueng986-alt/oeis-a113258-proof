name = "A113258"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["A113258"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "A113258"

[[lean_lib]]
name = "A113258Check"
precompileModules = true

[[lean_exe]]
name = "check"
root = "CheckMain"
